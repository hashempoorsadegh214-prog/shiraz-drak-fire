<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff7ed" />
  <title>سامانه هشدار خطر آتش‌سوزی در کوهستان</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      color: #18181b;
      background: linear-gradient(135deg, #fef3c7 0%, #fee2e2 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px 12px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrap { width: 100%; max-width: 480px; }

    .card {
      border: 2px solid #f59e0b;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(239, 68, 68, 0.15);
    }

    header {
      padding: 20px 16px 16px;
      text-align: center;
      background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 100%);
      border-bottom: 2px solid #ffedd5;
    }

    h1 {
      margin: 0 0 4px;
      color: #9a3412;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
    }

    .sub-title {
      font-size: 15px;
      color: #7c2d12;
      font-weight: 950;
      letter-spacing: -0.5px;
    }

    .panel {
      margin: 14px;
      padding: 18px 14px;
      border: 1px solid #fed7aa;
      border-radius: 20px;
      background: #fffaf5;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .update-time {
      margin-bottom: 12px;
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 22px;
      border-radius: 999px;
      background: #dc2626;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35);
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fde047;
      border: 1px solid #fef08a;
      box-shadow: 0 0 12px #facc15;
      animation: led-blink 1s ease-in-out infinite;
    }

    @keyframes led-blink {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 14px #facc15; }
      50% { opacity: 0.3; transform: scale(0.8); box-shadow: 0 0 4px #facc15; }
    }

    /* Standardized 5-band Gauge Graphic */
    .gauge-box {
      position: relative;
      width: 240px;
      height: 120px;
      margin: 22px auto 8px;
      overflow: hidden;
    }

    .gauge-arc {
      position: absolute;
      width: 240px;
      height: 120px;
      border-top-left-radius: 120px;
      border-top-right-radius: 120px;
      background: conic-gradient(
        from 270deg,
        #22c55e 0deg 36deg,
        #eab308 36deg 72deg,
        #f97316 72deg 108deg,
        #ef4444 108deg 144deg,
        #9333ea 144deg 180deg
      );
      -webkit-mask: radial-gradient(circle at 50% 100%, transparent 62%, #fff 63%);
      mask: radial-gradient(circle at 50% 100%, transparent 62%, #fff 63%);
    }

    .needle {
      position: absolute;
      bottom: 0;
      left: 120px;
      width: 4px;
      height: 100px;
      background: #18181b;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-90deg);
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    .hub {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background: #fff;
      border: 4px solid #18181b;
      border-radius: 50%;
    }

    .sec {
      margin: 0 14px 14px;
      padding: 14px;
      border: 1px solid #fed7aa;
      border-radius: 16px;
      background: #fff7ed;
    }

    .sec h2 {
      margin: 0 0 8px;
      color: #9a3412;
      font-size: 13px;
      font-weight: 800;
    }

    ul {
      margin: 0;
      padding-right: 18px;
      color: #7c2d12;
      font-size: 12px;
      line-height: 1.9;
      font-weight: 600;
    }

    .actions {
      margin: 0 14px 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #18181b;
      cursor: pointer;
    }

    .btn .small { font-size: 10px; color: #9a3412; font-weight: 700; margin-bottom: 2px; }
    .btn.alert { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .btn.primary { background: #dcfce7; border-color: #86efac; color: #166534; }
    .btn.warn { background: #fef3c7; border-color: #fde68a; color: #92400e; }

    .gps-box {
      display: none;
      margin: 0 14px 14px;
      padding: 10px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #cbd5e1;
      font-size: 11px;
      text-align: center;
    }
    .gps-box code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <header>
        <h1 id="headerTitle">سامانه هشدار خطر آتش‌سوزی در کوهستان</h1>
        <div class="sub-title" id="areaTitle">کوهستان دراک</div>
      </header>

      <section class="panel">
        <div class="update-time" id="updateTime">در حال بارگذاری زمان به‌روزرسانی...</div>

        <div class="badge">
          <div class="led"></div>
          <span id="riskText">در حال تحلیل داده‌های جوی...</span>
        </div>

        <div class="gauge-box">
          <div class="gauge-arc"></div>
          <div class="needle" id="needle"></div>
          <div class="hub"></div>
        </div>
      </section>

      <section class="sec">
        <h2>اقدامات فوری و توصیه‌های ایمنی</h2>
        <ul id="adviceList">
          <li>در حال دریافت دستورالعمل‌های حفاظتی...</li>
        </ul>
      </section>

      <nav class="actions">
        <a class="btn alert" href="tel:125">
          <span class="small">آتش‌نشانی</span>
          <span>۱۲۵</span>
        </a>
        <button class="btn primary" id="locBtn" type="button">
          <span class="small">موقعیت من</span>
          <span id="locText">نمایش/کپی</span>
        </button>
        <a class="btn warn" href="tel:137">
          <span class="small">منابع طبیعی</span>
          <span>۱۳۷</span>
        </a>
      </nav>

      <div class="gps-box" id="gpsBox">
        مختصات GPS: <code id="gpsCoords">—</code> <span id="gpsMapLinks"></span>
      </div>
    </section>
  </main>

  <script>
    const DATA_URL = "./data/derak_fwi.json";

    function getPersianDate() {
      try {
        return new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
          timeZone: "Asia/Tehran",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date());
      } catch (e) {
        return "";
      }
    }

    function getAdvice(level) {
      switch(level) {
        case "کم":
          return [
            "از رها کردن زباله و مواد پلاستیکی در طبیعت خودداری کنید.",
            "پیش از ترک محل، از خاموش شدن کامل هرگونه پسماند حرارتی مطمئن شوید."
          ];
        case "متوسط":
          return [
            "از روشن کردن آتش در عرصه‌های طبیعی خودداری کنید.",
            "ته‌سیگار یا کبریت روشن را در طبیعت رها نکنید."
          ];
        case "زیاد":
          return [
            "روشن کردن آتش و استعمال دخانیات در کوهستان ممنوع و خطرناک است.",
            "در صورت مشاهده کوچک‌ترین دود، فوراً مراتب را گزارش دهید."
          ];
        case "خیلی زیاد":
          return [
            "از حضور غیرضروری در محدوده‌های پوشش گیاهی متراکم و خشک خودداری کنید.",
            "هرگونه استفاده از آتش، ذغال و دخانیات اکیداً ممنوع است."
          ];
        case "بحرانی":
          return [
            "وضعیت فوق‌العاده؛ از ورود و توقف در کوهستان جداً خودداری کنید.",
            "هر جرقه‌ای می‌تواند به یک حریق گسترده تبدیل شود."
          ];
        default:
          return [
            "با احتیاط کامل در طبیعت تردد کنید.",
            "در صورت بروز حادثه با شماره‌های امدادی تماس بگیرید."
          ];
      }
    }

    async function loadData() {
      try {
        const res = await fetch(DATA_URL + "?_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        // Area Name
        if (data.area_name) {
          document.getElementById("areaTitle").textContent = data.area_name;
        }

        // Time
        let timeStr = data.updated_at || getPersianDate();
        document.getElementById("updateTime").textContent = timeStr ? `به‌روزرسانی: ${timeStr}` : "";

        // Risk Level & Needle Angle
        const fwi = parseFloat(data.fwi) || 0;
        let levelFa = data.risk_level_fa || "متوسط";
        document.getElementById("riskText").textContent = `سطح خطر: ${levelFa}`;

        let percent = Math.min(Math.max(fwi / 70, 0), 1);
        let angle = -90 + (percent * 180);
        document.getElementById("needle").style.transform = `translateX(-50%) rotate(${angle}deg)`;

        // Advice
        const items = getAdvice(levelFa);
        document.getElementById("adviceList").innerHTML = items.map(i => `<li>${i}</li>`).join("");

      } catch (err) {
        console.error(err);
        document.getElementById("updateTime").textContent = `به‌روزرسانی: ${getPersianDate()}`;
        document.getElementById("riskText").textContent = "سطح خطر: اطلاعات برخط";
        document.getElementById("needle").style.transform = "translateX(-50%) rotate(0deg)";
        document.getElementById("adviceList").innerHTML = "<li>از روشن کردن آتش در طبیعت خودداری کنید.<br>در صورت مشاهده دود با ۱۲۵ تماس بگیرید.</li>";
      }
    }

    document.getElementById("locBtn").addEventListener("click", () => {
      const locText = document.getElementById("locText");
      const gpsBox = document.getElementById("gpsBox");
      const gpsCoords = document.getElementById("gpsCoords");
      const gpsMapLinks = document.getElementById("gpsMapLinks");

      if (!navigator.geolocation) {
        alert("مرورگر شما از GPS پشتیبانی نمی‌کند.");
        return;
      }

      locText.textContent = "در حال یافتن...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(5);
          const lon = pos.coords.longitude.toFixed(5);
          const coordStr = `${lat}, ${lon}`;

          gpsCoords.textContent = coordStr;
          gpsBox.style.display = "block";
          locText.textContent = "کپی شد!";
          
          gpsMapLinks.innerHTML = ` | <a href="https://maps.google.com/?q=${coordStr}" target="_blank">نقشه</a>`;
          navigator.clipboard.writeText(coordStr).catch(()=>{});
          setTimeout(() => locText.textContent = "نمایش/کپی", 3000);
        },
        () => {
          locText.textContent = "خطا در GPS";
          alert("لطفاً دسترسی به موقعیت مکانی را فعال کنید.");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    loadData();
  </script>
</body>
</html>
