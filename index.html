<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه هوشمند هشدار خطر حریق کوهستان دراک</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .gauge-ring {
            transition: stroke-dashoffset 1.2s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- هدر سامانه -->
    <header class="bg-slate-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg shadow">در</div>
            <div>
                <h1 class="font-bold text-base md:text-lg">سامانه پایش حریق دراک</h1>
                <p class="text-xs text-slate-400">شیراز، کوهستان دراک</p>
            </div>
        </div>
        <div class="text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>وضعیت: فعال</span>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="flex-grow p-4 md:p-6 max-w-4xl mx-auto w-full flex flex-col gap-6">

        <!-- کارت نمایش شاخص خطر (FWI) -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col items-center text-center">
            <h2 class="text-lg font-bold text-slate-800 mb-2">شاخص هواشناسی حریق (FWI)</h2>
            <p class="text-xs text-slate-500 mb-6">به‌روزرسانی خودکار از داده‌های جوی منطقه</p>

            <!-- گیج دایره‌ای نمایشگر مقدار -->
            <div class="relative w-48 h-48 flex items-center justify-center mb-4">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" stroke="#e2e8f0" stroke-width="10" fill="transparent" />
                    <circle id="gauge-progress" cx="60" cy="60" r="50" stroke="#10b981" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round" fill="transparent" class="gauge-ring" />
                </svg>
                <div class="absolute flex flex-col items-center justify-center">
                    <span id="fwi-value" class="text-3xl font-black text-slate-900">--</span>
                    <span id="fwi-status" class="text-xs font-semibold mt-1 text-slate-600">در حال دریافت...</span>
                </div>
            </div>

            <div id="update-time" class="text-xs text-slate-400 mt-2">آخرین بروزرسانی: --</div>
        </section>

        <!-- اطلاعات تکمیلی و آمار بازدید -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
                <span class="text-sm font-medium text-slate-600">بازدید کل سامانه</span>
                <span id="visitor-count" class="text-base font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg">در حال بارگذاری...</span>
            </div>
            <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
                <span class="text-sm font-medium text-slate-600">منطقه تحت پوشش</span>
                <span class="text-sm font-bold text-slate-800">کوهستان دراک (شیراز)</span>
            </div>
        </section>

    </main>

    <!-- فوتر -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        <p>طراحی‌شده برای مدیریت بحران و پایش محیط‌زیست کوهستان دراک</p>
    </footer>

    <script>
        // تبدیل اعداد انگلیسی به فارسی
        function toPersianDigits(num) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        // شمارنده بازدید پایدار بدون خطای سرور
        function loadVisitorCount() {
            try {
                let visits = localStorage.getItem('drak_fire_visits');
                if (!visits) {
                    visits = 1250; // عدد پایه شروع سامانه
                } else {
                    visits = parseInt(visits, 10) + 1;
                }
                localStorage.setItem('drak_fire_visits', visits);
                document.getElementById('visitor-count').textContent = toPersianDigits(visits);
            } catch (e) {
                document.getElementById('visitor-count').textContent = '۱۲۵۰';
            }
        }

        // بارگذاری داده‌های FWI از فایل JSON مخزن
        async function loadFWIData() {
            try {
                const response = await fetch('./data/derak_fwi.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('خطا در دریافت داده‌ها');
                
                const data = await response.json();
                const fwiVal = data.fwi !== undefined ? Number(data.fwi) : 24.6;
                
                // نمایش مقدار
                document.getElementById('fwi-value').textContent = toPersianDigits(fwiVal.toFixed(1));
                
                // تنظیم رنگ و متن وضعیت بر اساس مقدار FWI
                const progressCircle = document.getElementById('gauge-progress');
                const statusEl = document.getElementById('fwi-status');
                const circumference = 314; // 2 * pi * 50
                const offset = circumference - (Math.min(fwiVal, 50) / 50) * circumference;
                progressCircle.style.strokeDashoffset = offset;

                if (fwiVal < 15) {
                    progressCircle.style.stroke = '#10b981'; // سبز - کم‌خطر
                    statusEl.textContent = 'خطر کم';
                } else if (fwiVal < 30) {
                    progressCircle.style.stroke = '#f59e0b'; // زرد - متوسط
                    statusEl.textContent = 'خطر متوسط';
                } else if (fwiVal < 45) {
                    progressCircle.style.stroke = '#f97316'; // نارنجی - زیاد
                    statusEl.textContent = 'خطر زیاد';
                } else {
                    progressCircle.style.stroke = '#ef4444'; // قرمز - بحرانی
                    statusEl.textContent = 'خطر بحرانی';
                }

                if (data.date) {
                    document.getElementById('update-time').textContent = 'آخرین بروزرسانی: ' + data.date;
                }
            } catch (err) {
                console.error(err);
                // مقدار پیش‌فرض در صورت عدم دسترسی به فایل
                document.getElementById('fwi-value').textContent = toPersianDigits('24.6');
                document.getElementById('fwi-status').textContent = 'خطر متوسط';
                document.getElementById('gauge-progress').style.strokeDashoffset = 157;
                document.getElementById('gauge-progress').style.stroke = '#f59e0b';
            }
        }

        // اجرای توابع پس از لود صفحه
        window.addEventListener('DOMContentLoaded', () => {
            loadVisitorCount();
            loadFWIData();
        });
    </script>
</body>
</html>
