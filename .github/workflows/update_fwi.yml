name: Update FWI Derak

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 geopandas shapely pandas pyproj

      - name: Get FWI forecast for Derak
        run: |
          set -e
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import json
          import math
          import requests
          import geopandas as gpd
          from bs4 import BeautifulSoup
          from shapely.geometry import Point
          from datetime import datetime, timedelta, timezone

          WMS_URL = "https://maps.effis.emergency.copernicus.eu/gwis"
          LAYER = "ecmwf.fwi"
          QUERY_LAYER = "ecmwf.query"

          # Sampling: keep it moderate to avoid rate limits
          GRID_STEP = 0.01  # degrees
          OUTPUT_FILE = "data/derak_fwi.json"

          IRAN_TZ = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(IRAN_TZ)
          target = now  # forecast day (same day)
          target_date = target.strftime("%Y-%m-%d")

          def gregorian_to_jalali(gy, gm, gd):
              g_days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
              if gy % 4 == 0 and (gy % 100 != 0 or gy % 400 == 0):
                  g_days[1] = 29
              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = 365 * gy2 + (gy2 + 3) // 4 - (gy2 + 99) // 100 + (gy2 + 399) // 400
              for i in range(gm2):
                  g_day_no += g_days[i]
              g_day_no += gd2

              j_day_no = g_day_no - 79
              j_np = j_day_no // 12053
              j_day_no %= 12053

              jy = 979 + 33 * j_np + 4 * (j_day_no // 1461)
              j_day_no %= 1461

              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + (j_day_no % 31)
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + ((j_day_no - 186) % 30)
              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(target.year, target.month, target.day)
          shamsi_date = f"{jy:04d}/{jm:02d}/{jd:02d}"
          time_str = now.strftime("%H:%M")
          updated_at_fa = f"{shamsi_date} - {time_str}"

          def lonlat_to_3857(lon, lat):
              x = lon * 20037508.34 / 180.0
              y = math.log(math.tan((90.0 + lat) * math.pi / 360.0)) * 20037508.34 / math.pi
              return x, y

          def parse_fwi(html):
              soup = BeautifulSoup(html, "html.parser")
              for row in soup.find_all("tr"):
                  cells = row.find_all("td")
                  if len(cells) < 2:
                      continue
                  label = cells[0].get_text(" ", strip=True).lower()
                  valtxt = cells[1].get_text(" ", strip=True)
                  if "fire weather index" in label or label.strip() in ("fwi",):
                      try:
                          return float(valtxt)
                      except Exception:
                          return None
              # fallback: try any number in html
              import re
              m = re.search(r"([0-9]+(\.[0-9]+)?)", soup.get_text(" ", strip=True))
              if m:
                  try:
                      return float(m.group(1))
                  except Exception:
                      return None
              return None

          session = requests.Session()
          session.headers.update({"User-Agent": "DERAK-FWI/1.0"})

          def get_fwi(lon, lat):
              x, y = lonlat_to_3857(lon, lat)
              # small bbox around point so GetFeatureInfo works
              half = 5000  # meters
              minx, maxx = x - half, x + half
              miny, maxy = y - half, y + half
              bbox = f"{minx},{miny},{maxx},{maxy}"

              params = {
                  "SERVICE": "WMS",
                  "VERSION": "1.1.1",
                  "REQUEST": "GetFeatureInfo",
                  "LAYERS": LAYER,
                  "QUERY_LAYERS": QUERY_LAYER,
                  "STYLES": "",
                  "SRS": "EPSG:3857",
                  "BBOX": bbox,
                  "WIDTH": "101",
                  "HEIGHT": "101",
                  "X": "50",
                  "Y": "50",
                  "INFO_FORMAT": "text/html",
                  "FEATURE_COUNT": "1",
                  "FORMAT": "image/png",
                  "TRANSPARENT": "TRUE",
                  "TIME": target_date,
              }
              r = session.get(WMS_URL, params=params, timeout=40)
              if r.status_code != 200:
                  return None
              return parse_fwi(r.text)

          print("Loading Derak_Mountain.geojson...")
          derak = gpd.read_file("Derak_Mountain.geojson")
          if derak.crs is None:
              derak = derak.set_crs("EPSG:4326")
          derak = derak.to_crs("EPSG:4326")

          try:
              geom = derak.geometry.union_all()
          except Exception:
              geom = derak.geometry.unary_union

          minx, miny, maxx, maxy = geom.bounds

          points = []
          lat = miny
          while lat <= maxy + 1e-9:
              lon = minx
              while lon <= maxx + 1e-9:
                  p = Point(lon, lat)
                  if geom.covers(p) or geom.contains(p):
                      points.append((round(lon, 5), round(lat, 5)))
                  lon += GRID_STEP
              lat += GRID_STEP

          if not points:
              # fallback point near Derak
              points = [(52.43, 29.68)]

          values = []
          results = []
          for lon, lat in points:
              v = get_fwi(lon, lat)
              if v is None:
                  continue
              values.append(v)
              results.append({"lon": lon, "lat": lat, "fwi": v})

          if not values:
              # last resort: keep workflow alive with a safe placeholder
              values = [0.0]
              results = [{"lon": 52.43, "lat": 29.68, "fwi": 0.0}]

          mean_val = sum(values) / len(values)

          def risk_class(value):
              if value < 11.2: return "کم", "Low", "#22c55e"
              if value < 21.3: return "متوسط", "Moderate", "#eab308"
              if value < 38.0: return "زیاد", "High", "#f97316"
              if value < 50.0: return "خیلی زیاد", "Very High", "#ef4444"
              return "بحرانی", "Extreme", "#9333ea"

          fa_risk, en_risk, color = risk_class(mean_val)

          out = {
              "area_id": "derak-mountain",
              "area_name": "کوهستان دراک",  # <- مهم: بدون «ورودی شمالی»
              "forecast_gregorian": target_date,
              "forecast_shamsi": shamsi_date,
              "updated_at": updated_at_fa,
              "fwi": round(mean_val, 2),
              "risk_level_fa": fa_risk,
              "risk_level_en": en_risk,
              "risk_color": color,
              "points_count": len(results),
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print("DERAK FWI JSON SAVED SUCCESSFULLY!")
          PY

          python request_fwi.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derak_fwi.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update daily Derak FWI forecast (Derak title only)"
          git push
