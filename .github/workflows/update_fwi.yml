name: Update FWI Derak

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 geopandas shapely pandas

      - name: Calculate High Resolution FWI for Mount Derak
        run: |
          set -e
          mkdir -p data

          cat > get_derak_fwi.py <<'PY'
          import json
          import math
          import requests
          import geopandas as gpd
          from bs4 import BeautifulSoup
          from shapely.geometry import Point
          from datetime import datetime, timedelta, timezone

          WMS_URL = "https://maps.effis.emergency.copernicus.eu/gwis"
          LAYER = "ecmwf.query"
          QUERY_LAYER = "ecmwf.query"

          GEOJSON_PATH = "Derak_Mountain.geojson"
          OUTPUT_FILE = "data/derak_fwi.json"

          IRAN_TZ = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(IRAN_TZ)

          # تاریخ پیش‌بینی: فردا
          target = now.date() + timedelta(days=1)
          target_date = target.strftime("%Y-%m-%d")

          def gregorian_to_jalali(gy, gm, gd):
              g_days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
              if gy % 4 == 0 and (gy % 100 != 0 or gy % 400 == 0):
                  g_days[1] = 29
              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1
              g_day_no = 365 * gy2 + (gy2 + 3) // 4 - (gy2 + 99) // 100 + (gy2 + 399) // 400
              for i in range(gm2):
                  g_day_no += g_days[i]
              g_day_no += gd2
              j_day_no = g_day_no - 79
              j_np = j_day_no // 12053
              j_day_no %= 12053
              jy = 979 + 33 * j_np + 4 * (j_day_no // 1461)
              j_day_no %= 1461
              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365
              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + j_day_no % 31
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + ((j_day_no - 186) % 30)
              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(target.year, target.month, target.day)
          shamsi_date = f"{jy:04d}/{jm:02d}/{jd:02d}"

          now_jy, now_jm, now_jd = gregorian_to_jalali(now.year, now.month, now.day)
          updated_at_fa = f"{now_jy:04d}/{now_jm:02d}/{now_jd:02d} - {now.strftime('%H:%M')}"

          def lonlat_to_3857(lon, lat):
              x = lon * 20037508.34 / 180.0
              y = math.log(math.tan(math.radians(lat) / 2.0 + math.pi / 4.0)) * 20037508.34 / math.pi
              return x, y

          def parse_fwi(html):
              soup = BeautifulSoup(html, "html.parser")
              for row in soup.find_all("tr"):
                  cells = row.find_all("td")
                  if len(cells) < 2:
                      continue
                  label = cells[0].get_text(" ", strip=True).lower()
                  value_text = cells[1].get_text(" ", strip=True)
                  if "fire weather index" in label:
                      try:
                          v = float(value_text)
                          if math.isfinite(v) and 0 <= v <= 200:
                              return round(v, 2)
                      except ValueError:
                          continue
              return None

          session = requests.Session()
          session.headers.update({"User-Agent": "SHIRAZ-DRAK-FWI/1.0"})

          def get_point_fwi(lon, lat):
              x, y = lonlat_to_3857(lon, lat)
              half_size = 8000
              bbox = f"{x - half_size},{y - half_size},{x + half_size},{y + half_size}"
              params = {
                  "SERVICE": "WMS",
                  "VERSION": "1.1.1",
                  "REQUEST": "GetFeatureInfo",
                  "LAYERS": LAYER,
                  "QUERY_LAYERS": QUERY_LAYER,
                  "STYLES": "",
                  "SRS": "EPSG:3857",
                  "BBOX": bbox,
                  "WIDTH": "101",
                  "HEIGHT": "101",
                  "X": "50",
                  "Y": "50",
                  "INFO_FORMAT": "text/html",
                  "FEATURE_COUNT": "1",
                  "FORMAT": "image/png",
                  "TRANSPARENT": "TRUE",
                  "TIME": target_date
              }
              try:
                  res = session.get(WMS_URL, params=params, timeout=20)
                  if res.status_code == 200:
                      return parse_fwi(res.text)
              except Exception:
                  pass
              return None

          def get_risk_info(fwi_val):
              if fwi_val < 11.2:
                  return "کم", "Low", "#22c55e"
              elif fwi_val < 21.3:
                  return "متوسط", "Moderate", "#eab308"
              elif fwi_val < 38.0:
                  return "زیاد", "High", "#f97316"
              elif fwi_val < 50.0:
                  return "خیلی زیاد", "Very High", "#ef4444"
              else:
                  return "بحرانی", "Extreme", "#9333ea"

          print(f"Loading {GEOJSON_PATH} ...")
          gdf = gpd.read_file(GEOJSON_PATH)
          if gdf.crs is None:
              gdf = gdf.set_crs("EPSG:4326")
          else:
              gdf = gdf.to_crs("EPSG:4326")

          try:
              geom = gdf.geometry.union_all()
          except Exception:
              geom = gdf.geometry.unary_union

          # ایجاد شبکه با تفکیک مکانی ریز در محدوده کوهستان دراک
          minx, miny, maxx, maxy = geom.bounds
          GRID_STEP = 0.008  # تفکیک دقیق حدود ۸۰۰ متر روی کوهستان دراک

          grid_points = []
          curr_y = miny
          while curr_y <= maxy:
              curr_x = minx
              while curr_x <= maxx:
                  p = Point(curr_x, curr_y)
                  if geom.covers(p) or geom.contains(p):
                      grid_points.append((round(curr_x, 5), round(curr_y, 5)))
                  curr_x += GRID_STEP
              curr_y += GRID_STEP

          # در صورتی که نقاط کم بود، نقاط کمکی اضافه شوند
          if len(grid_points) == 0:
              c = geom.representative_point()
              grid_points.append((round(c.x, 5), round(c.y, 5)))

          print(f"Sampling {len(grid_points)} high-resolution points inside Mount Derak boundary...")

          collected_fwi = []
          for idx, (lon, lat) in enumerate(grid_points, start=1):
              fwi_val = get_point_fwi(lon, lat)
              if fwi_val is not None:
                  collected_fwi.append(fwi_val)
                  print(f"[{idx}/{len(grid_points)}] ({lat}, {lon}) -> FWI: {fwi_val}")
              else:
                  print(f"[{idx}/{len(grid_points)}] ({lat}, {lon}) -> No Data")

          if collected_fwi:
              mean_fwi = round(sum(collected_fwi) / len(collected_fwi), 2)
              risk_fa, risk_en, risk_color = get_risk_info(mean_fwi)
          else:
              mean_fwi = None
              risk_fa, risk_en, risk_color = "نامشخص", "No Data", "#94a3b8"

          result = {
              "area_id": "derak-mountain",
              "area_name": "کوهستان دراک",
              "forecast_gregorian": target_date,
              "forecast_shamsi": shamsi_date,
              "updated_at": updated_at_fa,
              "fwi": mean_fwi,
              "risk_level_fa": risk_fa,
              "risk_level_en": risk_en,
              "risk_color": risk_color,
              "points_count": len(collected_fwi),
              "last_epoch": int(now.timestamp())
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated Derak JSON successfully:")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

          python get_derak_fwi.py

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derak_fwi.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update high-resolution FWI for Mount Derak"
            git push
          fi
