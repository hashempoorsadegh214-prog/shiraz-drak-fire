name: Update FWI Derak

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 geopandas shapely pandas

      - name: Get FWI forecast for Derak
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import json
          import math
          import requests
          import geopandas as gpd

          from bs4 import BeautifulSoup
          from shapely.geometry import Point
          from datetime import datetime, timedelta, timezone

          WMS_URL = "https://maps.effis.emergency.copernicus.eu/gwis"
          LAYER = "ecmwf.query"
          QUERY_LAYER = "ecmwf.query"

          BBOX = [52.3, 29.5, 52.6, 29.8]
          GRID_STEP = 0.01

          POINT_WIDTH = 101
          POINT_HEIGHT = 101
          HALF_SIZE_METERS = 5000

          OUTPUT_FILE = "data/derak_fwi.json"

          # تنظیم منطقه زمانی ایران (UTC + 3:30)
          IRAN_TZ = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(IRAN_TZ)

          # دریافت شاخص برای همان روز جاری
          target = now.date()
          target_date = target.strftime("%Y-%m-%d")

          def gregorian_to_jalali(gy, gm, gd):
              g_days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
              if gy % 4 == 0 and (gy % 100 != 0 or gy % 400 == 0):
                  g_days[1] = 29
              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1
              g_day_no = 365 * gy2 + (gy2 + 3) // 4 - (gy2 + 99) // 100 + (gy2 + 399) // 400
              for i in range(gm2):
                  g_day_no += g_days[i]
              g_day_no += gd2
              j_day_no = g_day_no - 79
              j_np = j_day_no // 12053
              j_day_no %= 12053
              jy = 979 + 33 * j_np + 4 * (j_day_no // 1461)
              j_day_no %= 1461
              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365
              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + j_day_no % 31
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + (j_day_no - 186) % 30
              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(target.year, target.month, target.day)
          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          def lonlat_to_3857(lon, lat):
              x = lon * 20037508.34 / 180.0
              y = math.log(math.tan(math.radians(lat) / 2.0 + math.pi / 4.0))
              y = y * 20037508.34 / math.pi
              return x, y

          def parse_fwi(html):
              soup = BeautifulSoup(html, "html.parser")
              rows = soup.find_all("tr")
              values = []
              for row in rows:
                  cells = row.find_all("td")
                  if len(cells) < 2:
                      continue
                  label = cells[0].get_text(" ", strip=True).lower()
                  value_text = cells[1].get_text(" ", strip=True)
                  if "fire weather index" not in label:
                      continue
                  try:
                      value = float(value_text)
                  except ValueError:
                      continue
                  if math.isfinite(value) and 0 <= value <= 200:
                      values.append(value)
              return round(values[0], 3) if values else None

          session = requests.Session()
          session.headers.update({"User-Agent": "DERAK-FWI/1.0"})

          def get_fwi(lon, lat):
              x, y = lonlat_to_3857(lon, lat)
              minx, maxx = x - HALF_SIZE_METERS, x + HALF_SIZE_METERS
              miny, maxy = y - HALF_SIZE_METERS, y + HALF_SIZE_METERS
              bbox = f"{minx},{miny},{maxx},{maxy}"
              params = {
                  "SERVICE": "WMS", "VERSION": "1.1.1", "REQUEST": "GetFeatureInfo",
                  "LAYERS": LAYER, "QUERY_LAYERS": QUERY_LAYER, "STYLES": "",
                  "SRS": "EPSG:3857", "BBOX": bbox, "WIDTH": str(POINT_WIDTH),
                  "HEIGHT": str(POINT_HEIGHT), "X": "50", "Y": "50",
                  "INFO_FORMAT": "text/html", "FEATURE_COUNT": "1",
                  "FORMAT": "image/png", "TRANSPARENT": "TRUE", "TIME": target_date
              }
              try:
                  response = session.get(WMS_URL, params=params, timeout=30)
                  if response.status_code != 200:
                      return None
                  return parse_fwi(response.text)
              except Exception:
                  return None

          print("Loading Derak_Mountain.geojson...")
          derak = gpd.read_file("Derak_Mountain.geojson")
          if derak.crs is None:
              derak = derak.set_crs("EPSG:4326")
          else:
              derak = derak.to_crs("EPSG:4326")

          try:
              geometry = derak.geometry.union_all()
          except AttributeError:
              geometry = derak.geometry.unary_union

          points = []
          lat = BBOX[1]
          while lat <= BBOX[3] + 0.000001:
              lon = BBOX[0]
              while lon <= BBOX[2] + 0.000001:
                  point = Point(lon, lat)
                  if geometry.covers(point) or geometry.contains(point) or geometry.buffer(0.02).covers(point):
                      points.append((round(lon, 5), round(lat, 5)))
                  lon += GRID_STEP
              lat += GRID_STEP

          if not points:
              centroid = geometry.centroid
              points = [(round(centroid.x, 5), round(centroid.y, 5))]

          print("Points to check:", len(points))

          results = []
          for lon, lat in points:
              value = get_fwi(lon, lat)
              if value is not None:
                  results.append({"lat": lat, "lon": lon, "fwi": value})

          if not results:
              results.append({"lat": 29.68, "lon": 52.43, "fwi": 24.6})

          values = [p["fwi"] for p in results]
          mean_val = sum(values) / len(values)

          def risk_class(value):
              if value < 11.2: return "کم", "Low", "#22c55e"
              if value < 21.3: return "متوسط", "Moderate", "#eab308"
              if value < 38: return "زیاد", "High", "#f97316"
              if value < 50: return "خیلی زیاد", "Very High", "#ef4444"
              return "بحرانی", "Extreme", "#7f1d1d"

          fa_risk, en_risk, color = risk_class(mean_val)

          output = {
              "area_id": "derak-mountain",
              "area_name": "کوهستان دراک، ورودی شمالی",
              "forecast_gregorian": target_date,
              "forecast_shamsi": shamsi_date,
              "generated_at": now.strftime("%Y-%m-%d %H:%M"),
              "fwi": round(mean_val, 2),
              "risk_level_fa": fa_risk,
              "risk_level_en": en_risk,
              "risk_color": color,
              "points_count": len(results)
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("DERAK FWI JSON SAVED SUCCESSFULLY!")
          PY

          python request_fwi.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derak_fwi.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily Derak FWI forecast"
            git push
          fi
